name: CI
on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schematic_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: "test"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/schematic_review"
      SECRET_KEY: "ci-test-secret-key-0123456789abcdef"
      DATA_DIR: "/home/runner/work/Research/Research/data"
      LLM_PROVIDER: "mock"
      LLM_API_KEY: "mock-key-for-ci"
      # 关键：用 zhipu 而不是 fake，因为 DB 是 1024 维（Sprint 1 定死的）
      RAG_EMBEDDING_BACKEND: "zhipu"
    steps:
      - uses: actions/checkout@v4
      - name: Create symlinks for CI compatibility
        run: |
          # 把 /data 和 /out 指向仓库目录，绕过硬编码路径
          sudo mkdir -p /data /out
          sudo chmod -R 777 /data /out
          sudo ln -sfn $(pwd)/data/* /data/ || true
          sudo ln -sfn $(pwd)/out/* /out/ || true
          # 如果直接 ln -s $(pwd)/data /data 会失败（/data 已存在），
          # 改用 cp -r 更稳
          sudo cp -r $(pwd)/data/* /data/ 2>/dev/null || true
          sudo cp -r $(pwd)/out/* /out/ 2>/dev/null || true
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Install dependencies (backend)
        working-directory: backend
        run: uv sync --extra dev --frozen
      - name: Initialize database schema
        working-directory: backend
        run: |
          sleep 5
          uv run alembic upgrade head
      - name: Verify migration head
        working-directory: backend
        run: |
          uv run alembic current
          uv run alembic current | grep -q "s3_b4_rule_history (head)"
      - name: Run backend tests (non-integration)
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run python -m pytest -m "not integration" -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (frontend)
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run type-check
      - name: Build
        working-directory: frontend
        run: npm run build
