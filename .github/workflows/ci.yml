name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schematic_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: "test"
      # 用 postgres 服务名（通过 CI services 内网 DNS）而不是 localhost
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@postgres:5432/schematic_review"
      # 补齐 Settings 必填字段（本地从 .env 读，CI 里显式设置）
      SECRET_KEY: "ci-test-secret-key-0123456789abcdef"
      DATA_DIR: "/home/runner/work/Research/Research/data"
      LLM_PROVIDER: "mock"
      LLM_API_KEY: "mock-key-for-ci"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install dependencies (backend)
        working-directory: backend
        run: uv sync --extra dev --frozen

      - name: Initialize database schema
        working-directory: backend
        run: |
          sleep 5
          uv run alembic upgrade head

      - name: Run backend tests (non-integration)
        working-directory: backend
        run: uv run python -m pytest -m "not integration" -v
        env:
          # 这一层覆盖：让 config.py 的 localhost 校验不触发
          DATABASE_URL: "postgresql+psycopg://postgres:postgres@postgres:5432/schematic_review"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (frontend)
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run type-check
      - name: Build
        working-directory: frontend
        run: npm run build