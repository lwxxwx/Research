[project]
name = "schematic-review-backend"
version = "0.1.0"
description = "AI Schematic Review MVP Backend"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Web Framework
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",

    # Configuration & Validation
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",

    # Database
    "sqlalchemy==2.0.23",
    "psycopg[binary]==3.1.18",          # PostgreSQL Driver (psycopg 3)
    "pgvector==0.5.0",                  # Vector type/operations(modefied by Phase C · Database)

    # Environment & Serialization
    "python-dotenv==1.0.0",
    "pyyaml==6.0.1",
    "jsonschema==4.20.0",               # Golden Case / JSON Schema 校验
    # JSON日志
    "python-json-logger==2.0.7",

    # HTTP Client
    "httpx==0.25.1",

    # Data Processing & Benchmark
    "pandas==2.1.3",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",

    # Linting & Formatting (Ruff only)
    "ruff==0.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D"]
ignore = ["D100", "D104", "D203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]