notes: |
  Case004 为 A 类（Rule-Only）UART 接口案例，覆盖 IO_002 + IO_003。
  构造方式：基于 8051 最小系统，外接 UART_BRIDGE（U2）。
    1. 正常 UART 互连：U1.P3_1(TXD)↔U2.RXD、U1.P3_0(RXD)↔U2.TXD
    2. 缺陷 E1：U1.P3_6(WR) 与 U2.OUT 同网（IO_003 命中）
    3. 缺陷 E2：U1.P1_0 与 U1.P1_1 同网（IO_002 命中）
  U2 的 lib_name = UART_BRIDGE（不匹配 MCU 白名单，用于 IO_003 判定外部器件）。
  其余电路（复位、晶振、电源去耦）拓扑正确，不触发 POWER_001/002 / CLOCK_001/002。