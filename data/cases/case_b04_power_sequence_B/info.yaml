notes: |
  Case B04 为 B 类（AI 辅助发现）案例，含 1 rule + 1 ai_discovered。
  规则能发现：POWER_001（VCC_3V3 缺去耦）。
  AI 才能发现：上电时序异常（需多路电源时序分析 + 器件 Datasheet 知识）。
  设计边界：
    - 10 条规则中无任何时序相关检查项，该缺陷 100% 属规则覆盖不到的多路时序关系
    - 若 5V 先于 3.3V 建立（如通过时序控制芯片），本缺陷不触发
    - 若 U4 输入/输出电容与 U3 相同，启动速度相近，本缺陷不触发
  规则命中：POWER_001（VCC_3V3 缺去耦）+ IO_001（low，不计入 defect）。
  IO_003 不命中（SPI_MISO 的 U1.P1_5 是 input，不是 output）。