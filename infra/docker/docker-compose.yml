# ============================================================================
# Docker Compose 公共基座 - Sprint 0 V1.2
# 文件：infra/docker/docker-compose.yml
#
# 职责：
#   1. 定义 Backend / PostgreSQL / Frontend-Placeholder 公共服务
#   2. PostgreSQL Named Volume（支持 VOLUME_SUFFIX 多实例隔离）
#   3. 定义 Docker Network（支持 NETWORK_SUFFIX 多实例隔离）
#   4. Dev / Prod 通过 overlay 文件扩展
#
# ⚠️ 设计原则：
#   - 基座只定义"服务是什么"，不定义"服务如何运行"
#   - container_name / restart / ports 全部下沉到 overlay
#   - 避免固定配置导致的多实例冲突、调试困难、安全风险
#
# ============================================================================
# 配套 Overlay 文件配置指引
# ============================================================================
#
# docker-compose.dev.yml（开发环境）：
#   - restart: "no"           # 崩溃保留现场，便于调试
#   - ports: 暴露服务端口到宿主机
#   - volumes: 源码挂载（热重载）、数据目录挂载
#
# docker-compose.prod.yml（生产环境）：
#   - restart: unless-stopped # 高可用自动恢复
#   - 数据库端口禁止直接暴露宿主机，通过内部网络访问
#   - 单机docker compose不支持deploy.resources；资源限制依靠Docker Desktop设置 / K8s / Docker Swarm
#
# ============================================================================
# 扩展说明-Profiles可选工具服务
# ============================================================================
# 数据库管理工具(pgadmin)等辅助工具不纳入本基座；
# 放置于独立 overlay 文件 docker-compose.tools.yml，使用 compose profiles 按需启用，
# ⚠️ tools 必须与基座叠加使用，不可单独启动。
# 示例启动命令（PowerShell 下用 cmd /c 包装，-f 用 $PWD 绝对路径）：
#   cmd /c "docker compose -f \"$PWD/infra/docker/docker-compose.yml\" -f \"$PWD/infra/docker/docker-compose.tools.yml\" --profile dev-tools up -d"
# ============================================================================
#
# Sprint0 开发启动命令（PowerShell 下用 cmd /c 包装，-f 用 $PWD 绝对路径）：
#   cmd /c "docker compose -f \"$PWD/infra/docker/docker-compose.yml\" -f \"$PWD/infra/docker/docker-compose.dev.yml\" up -d --build"
#
# 多实例并行开发（Compose原生方式，设置COMPOSE_PROJECT_NAME）：
#   $env:COMPOSE_PROJECT_NAME="dev01"
#   cmd /c "docker compose -f \"$PWD/infra/docker/docker-compose.yml\" -f \"$PWD/infra/docker/docker-compose.dev.yml\" up -d --build"
#
# 文档约束：Backend访问数据库必须使用服务名 postgres:5432，禁止 localhost
# ============================================================================
# ============================================================================
# Named Volumes
# Sprint0 Environment Freeze：Persistence = Named Volume pgdata
# 增加 VOLUME_SUFFIX 环境变量，支持本机多套项目实例并行，避免数据串扰
# ============================================================================
volumes:
  pgdata:
    name: pgdata_${VOLUME_SUFFIX:-base}
    driver: local

# ============================================================================
# Networks
# Sprint0 Environment Freeze：Network 原始名称 backend_net
# 增加 NETWORK_SUFFIX 支持多实例隔离
# ============================================================================
networks:
  backend_net:
    name: backend_net_${NETWORK_SUFFIX:-base}
    driver: bridge

# ============================================================================
# Services
# ============================================================================
services:
  # --------------------------------------------------------------------------
  # PostgreSQL + pgvector
  # Sprint0 Environment Freeze：PostgreSQL 15，pgvector向量扩展
  # initdb脚本只读挂载，仅volume首次初始化执行
  #
  # 基座职责：定义镜像、环境变量、卷挂载、网络、服务就绪健康检查
  # 运行时配置（container_name / restart / ports）下沉到 overlay
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_secure_pwd_CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-schematic_review}
      # PostgreSQL 性能调优（开发默认，生产通过 overlay 覆盖）
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-128MB}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-20}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # ⚠️ 使用$$，变量在容器内部解析，读取容器内部POSTGRES_*环境变量
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend_net

  # --------------------------------------------------------------------------
  # Backend FastAPI
  # build上下文必须与 Dockerfile 中的 COPY 路径匹配
  # context: ../../backend 与 Sprint0 A3已交付Dockerfile完全兼容
  #
  # 基座职责：定义构建上下文、镜像、环境变量、依赖关系
  # 运行时配置（container_name / restart / ports）下沉到 overlay
  # ⚠️ 不在这里定义healthcheck，完全复用backend/Dockerfile内部HEALTHCHECK
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: schematic-review-backend:${TAG:-latest}
    # ===== [CHANGE-1] 新增：compose 直接读项目根 .env，注入所有变量 =====
    # 目的：
    #   1. 解决 ${VAR:-default} 从 infra/docker/.env 读取（不读项目根 .env）的问题
    #   2. 使 LLM_PROVIDER / ZHIPUAI_API_KEY / RAG_EMBEDDING_* 等变量直接注入容器
    #   3. 无需 --env-file，无需维护 backend/.env
    # 路径：../../.env 相对本文件 = <project_root>/.env
    env_file:
      - ../../.env
    # ===== [CHANGE-1 END] =====
    environment:
      # ------------------------------------------------------------
      # [原逻辑 - 保留注释，便于对照回滚]
      # env_file 已提供所有变量，以下 environment 仅保留"容器内路径强制"
      # 原内容（已删除）：
      #   DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://...}
      #   APP_ENV: ${APP_ENV:-dev}
      #   LOG_LEVEL: ${LOG_LEVEL:-INFO}
      #   SECRET_KEY: ${SECRET_KEY:-change_me_in_production_env}
      #   PYTHONPATH: ${PYTHONPATH:-/app:/}
      #   LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      #   LLM_API_KEY: ${LLM_API_KEY:-your_api_key_here}
      #   DATA_DIR: ${DATA_DIR:-/data}
      # 原因：${VAR:-default} 从 -f 第一个文件目录的 .env 读（infra/docker/.env），
      #       不读项目根 .env，导致 LLM_PROVIDER=zhipu 等值不生效。
      # ------------------------------------------------------------
      # ===== [CHANGE-2] 新增：容器内路径强制（固定值，不走 ${VAR:-default}） =====
      PYTHONPATH: /app:/
      DATA_DIR: /data
      # ===== [CHANGE-2 END] =====
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net

    # --------------------------------------------------------------------------
  # Frontend（Vite 构建产物 → Nginx）
  # Sprint 3 legacy 批次④：Dockerfile 多阶段构建，COPY dist 进 /usr/share/nginx/html
  # 本地开发调试用 5173（vite dev server）；3000 用于验证生产打包制品
  # 运行时配置（container_name / restart / ports）下沉到 overlay
  # --------------------------------------------------------------------------
  frontend:
    # Sprint 3 legacy 批次④（D23）：由 frontend/Dockerfile 构建，COPY dist 进 Nginx
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: schematic-review-frontend:${TAG:-latest}
    networks:
      - backend_net